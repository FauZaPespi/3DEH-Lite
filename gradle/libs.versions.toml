[versions]
# Lowest Paper release exposing both the Folia region schedulers and the Brigadier command API.
# Verified binary-compatible with 1.21.x: Commands and LifecycleEvents.COMMANDS signatures match.
paper = "1.20.6-R0.1-SNAPSHOT"
# Adventure version bundled with Paper 1.20.6. Only used to build the test classpath.
adventure = "4.17.0"
joml = "1.10.5"
junit = "5.10.2"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure" }
adventure-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }
joml = { module = "org.joml:joml", version.ref = "joml" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
